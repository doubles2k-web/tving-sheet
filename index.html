<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=880, initial-scale=1.0, viewport-fit=cover">
<title>TVING 자막 시트 프로토타입 (Phone)</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  min-height: 844px;
  background: #000;
}

body {
  display: flex;
  align-items: flex-start;
  gap: 100px;
}

.player {
  position: relative;
  width: 390px;
  height: 844px;
  flex-shrink: 0;
  font-family: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif;
  overflow: hidden;
  user-select: none;
}

/* depth2 예시 프레임: 모서리 40px 라운드 (Figma rounded-40 프레임) */
.player.player--rounded {
  border-radius: 40px;
}

/* ─── BACKGROUND ─── */
.player-bg-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* ─── 클릭 트리거 영역 (자막 아이콘, 실측 bbox 355~372 x 785~798) ─── */
.cc-trigger {
  position: absolute;
  top: 772px;
  left: 340px;
  width: 42px;
  height: 38px;
  cursor: pointer;
  z-index: 10;
  background: rgba(255, 0, 0, 0.4);
}

/* ─── DROP SHEET (하단·좌측 고정, 높이만 depth에 따라 변화) ─── */
.sheet {
  position: absolute;
  left: 86px;
  bottom: 42px;
  width: 260px;
  background: #27272E;
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  z-index: 300;
  /* 닫힘: 자막 아이콘과 가까운 우측 하단 모서리로 수렴 */
  clip-path: inset(100% 0% 0% 100% round 20px);
  transition:
    height 0.32s cubic-bezier(0.22, 1, 0.36, 1),
    clip-path 0.32s cubic-bezier(0.22, 1, 0.36, 1),
    opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1);
}

.sheet.no-transition { transition: none !important; }

.sheet.open {
  opacity: 1;
  pointer-events: auto;
  clip-path: inset(0% 0% 0% 0% round 20px);
}

.sheet-view {
  position: absolute;
  top: 0; left: 0; width: 100%;
  opacity: 1;
  transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1);
}

.sheet-view.hidden {
  display: none;
}

.sheet-view.fading {
  opacity: 0;
}

/* ─── HEADER ─── */
.sheet-hd {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 48px;
  padding: 0 20px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
}

.sheet-title {
  flex: 1;
  font-size: 18px;
  font-weight: 700;
  color: white;
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sheet-action-btn {
  background: none;
  border: none;
  color: #14D8FF;
  font-size: 15px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  padding: 6px 0;
  transition: opacity 0.15s;
}

.sheet-action-btn:active { opacity: 0.6; }

.back-btn {
  background: none;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  padding: 0;
  cursor: pointer;
  flex-shrink: 0;
  color: white;
}

.back-btn:active { opacity: 0.6; }

/* ─── LIST (depth1) ─── */
.sheet-list {
  padding: 4px 6px;
}

.list-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 11px 14px;
  cursor: pointer;
  border-radius: 10px;
  transition: background 0.12s;
}

.list-item:active { background: rgba(255,255,255,0.08); }

.item-label {
  flex: 1;
  font-size: 16px;
  color: rgba(255,255,255,0.88);
  line-height: 1.5;
}

.list-item.selected .item-label {
  color: #ffffff;
  font-weight: 600;
}

.item-check {
  width: 22px; height: 22px;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity 0.15s;
}

.list-item.selected .item-check { opacity: 1; }

/* ─── BODY (depth2) ─── */
.sheet-body {
  padding: 8px 20px 24px;
}

.sheet-desc {
  font-size: 16px;
  color: rgba(255,255,255,0.65);
  line-height: 1.5;
}

.clr-blue { color: #14D8FF; }

</style>
</head>
<body>

<!-- ══════════════════════════════════════════ -->
<!-- PLAYER 1: 자막 언어 / 자막 설정            -->
<!-- ══════════════════════════════════════════ -->
<div class="player">

  <img class="player-bg-img" src="Img/player-bg.png" alt="">

  <div class="cc-trigger"></div>

  <div class="sheet">

    <div class="sheet-view">
      <div class="sheet-hd">
        <span class="sheet-title">자막 언어</span>

      <div class="sheet-list">

          <span class="item-label">사용안함</span>

            <path d="M5 12l5 5L19 7" stroke="#14D8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="list-item" data-val="ko">
          <span class="item-label">한국어</span>
          <svg class="item-check" viewBox="0 0 24 24" fill="none">

          </svg>
        </div>
        <div class="list-item" data-val="en">
          <span class="item-label">영어</span>
          <svg class="item-check" viewBox="0 0 24 24" fill="none">
            <path d="M5 12l5 5L19 7" stroke="#14D8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="list-item" data-val="ja">
          <span class="item-label">일본어</span>
          <svg class="item-check" viewBox="0 0 24 24" fill="none">
            <path d="M5 12l5 5L19 7" stroke="#14D8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="list-item" data-val="gl">
          <span class="item-label">가르시아어</span>
          <svg class="item-check" viewBox="0 0 24 24" fill="none">
            <path d="M5 12l5 5L19 7" stroke="#14D8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="list-item" data-val="zh-cn">
          <span class="item-label">중국어 (간체)</span>
          <svg class="item-check" viewBox="0 0 24 24" fill="none">
            <path d="M5 12l5 5L19 7" stroke="#14D8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="list-item" data-val="zh-tw">
          <span class="item-label">중국어 (번체)</span>
          <svg class="item-check" viewBox="0 0 24 24" fill="none">
            <path d="M5 12l5 5L19 7" stroke="#14D8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="list-item" data-val="vi">
          <span class="item-label">베트남어</span>
          <svg class="item-check" viewBox="0 0 24 24" fill="none">
            <path d="M5 12l5 5L19 7" stroke="#14D8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="list-item" data-val="th">
          <span class="item-label">태국어</span>
          <svg class="item-check" viewBox="0 0 24 24" fill="none">
            <path d="M5 12l5 5L19 7" stroke="#14D8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="sheet-view hidden">
      <div class="sheet-hd">
        <button class="back-btn js-back" aria-label="뒤로가기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M15 5l-7 7 7 7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="sheet-title">자막 설정</span>
      </div>
      <div class="sheet-body">
        <p class="sheet-desc">
          iOS 기기에서는
          <span class="clr-blue">설정 &gt; 손쉬운 사용 &gt; 자막 및 청각 장애인용 자막 &gt; 스타일 메뉴</span>에서
          자막 설정을 변경하실 수 있습니다.
        </p>
      </div>
    </div>

  </div>

</div><!-- .player -->

<!-- ══════════════════════════════════════════ -->
<!-- PLAYER 2: 동일 인터랙션 (라운드 프레임)     -->
<!-- ══════════════════════════════════════════ -->
<div class="player player--rounded player--fixed-height">

  <img class="player-bg-img" src="Img/player-bg.png" alt="">

  <div class="cc-trigger"></div>

  <div class="sheet">

    <div class="sheet-view">
      <div class="sheet-hd">
        <span class="sheet-title">자막 언어</span>
        <button class="sheet-action-btn js-open-settings">자막 설정</button>
      </div>
      <div class="sheet-list">
        <div class="list-item selected" data-val="none">
          <span class="item-label">사용안함</span>
          <svg class="item-check" viewBox="0 0 24 24" fill="none">
            <path d="M5 12l5 5L19 7" stroke="#14D8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="list-item" data-val="ko">
          <span class="item-label">한국어</span>

          </svg>
        </div>
        <div class="list-item" data-val="en">
          <span class="item-label">영어</span>

            <path d="M5 12l5 5L19 7" stroke="#14D8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="list-item" data-val="ja">
          <span class="item-label">일본어</span>
          <svg class="item-check" viewBox="0 0 24 24" fill="none">
            <path d="M5 12l5 5L19 7" stroke="#14D8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="list-item" data-val="gl">
          <span class="item-label">가르시아어</span>

          </svg>
        </div>
        <div class="list-item" data-val="zh-cn">

        </div>
        <div class="list-item" data-val="zh-tw">
          <span class="item-label">중국어 (번체)</span>
          <svg class="item-check" viewBox="0 0 24 24" fill="none">
            <path d="M5 12l5 5L19 7" stroke="#14D8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="list-item" data-val="vi">

    </div>

    <div class="sheet-view hidden">
      <div class="sheet-hd">

<script>
(function () {
  'use strict';

  function initPlayer(player) {
    const trigger      = player.querySelector('.cc-trigger');
    const sheet        = player.querySelector('.sheet');
    const viewLang     = player.querySelectorAll('.sheet-view')[0];
    const viewSettings = player.querySelectorAll('.sheet-view')[1];
    const openSettBtn  = player.querySelector('.js-open-settings');
    const backBtn      = player.querySelector('.js-back');
    const subtitleList = player.querySelector('.sheet-list');
    const fixedHeight   = player.classList.contains('player--fixed-height');

    let isOpen = false;

    function setHeight(view) {
      sheet.style.height = view.scrollHeight + 'px';
    }

    // 시트가 항상 실제 높이를 갖도록 초기화 (열림 애니메이션은 clip-path가 담당)
    sheet.classList.add('no-transition');
    setHeight(viewLang);
    void sheet.offsetWidth;
    sheet.classList.remove('no-transition');

    function open() {
      viewLang.classList.remove('hidden');
      viewSettings.classList.add('hidden');
      sheet.classList.add('no-transition');
      setHeight(viewLang);
      void sheet.offsetWidth;
      sheet.classList.remove('no-transition');
      requestAnimationFrame(function () {
        sheet.classList.add('open');
      });
      isOpen = true;
    }

    function close() {
      sheet.classList.remove('open');
      isOpen = false;
    }

    function goTo(nextView, currentView) {
      // nextView를 opacity 0 상태로 미리 표시하고, 컨테이너 높이를 목표값으로 전환 시작
      nextView.classList.add('fading');
      nextView.classList.remove('hidden');
      // fixedHeight 인스턴스는 depth가 바뀌어도 시트 높이를 그대로 유지 (Figma 스펙: depth2도 520px)
      if (!fixedHeight) setHeight(nextView);
      // force reflow so the browser registers the starting (opacity 0) state
      void nextView.offsetWidth;

      requestAnimationFrame(function () {
        // 높이 변화와 같은 타이밍으로 크로스페이드 동시 진행
        currentView.classList.add('fading');
        nextView.classList.remove('fading');
      });

      // 전환이 끝난 뒤 이전 화면 정리
      setTimeout(function () {
        currentView.classList.add('hidden');
        currentView.classList.remove('fading');
      }, 340);
    }

    trigger.addEventListener('click', function (e) {
      e.stopPropagation();
      if (isOpen) { close(); } else { open(); }
    });

    openSettBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      goTo(viewSettings, viewLang);
    });

    backBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      goTo(viewLang, viewSettings);
    });

    subtitleList.addEventListener('click', function (e) {
      const item = e.target.closest('.list-item');
      if (!item) return;
      subtitleList.querySelectorAll('.list-item').forEach(function (el) {
        el.classList.remove('selected');
      });
      item.classList.add('selected');
      e.stopPropagation();
    });

    sheet.addEventListener('click', function (e) { e.stopPropagation(); });

    player.addEventListener('click', function () {
      if (isOpen) close();
    });
  }

  document.querySelectorAll('.player').forEach(initPlayer);

})();
</script>
</body>
</html>

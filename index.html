<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0, viewport-fit=cover">
<title>TVING 자막 시트 프로토타입 (Phone)</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  min-height: 844px;
  background: #000;
}

.player {
  position: relative;
  width: 390px;
  height: 844px;
  font-family: 'Pretendard', -apple-system, 'Noto Sans KR', sans-serif;
  overflow: hidden;
  user-select: none;
}

/* ─── BACKGROUND ─── */
.player-bg-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* ─── DROP SHEET (기존 카드: 뒤로 밀릴 때 축소 + dim) ─── */
.sheet {
  position: absolute;
  width: 260px;
  background: #27272E;
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  z-index: 300;
  transition:
    height 0.32s cubic-bezier(0.22, 1, 0.36, 1),
    clip-path 0.32s cubic-bezier(0.22, 1, 0.36, 1),
    opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1);
}

.no-transition { transition: none !important; }

.sheet.open {
  opacity: 1;
  pointer-events: auto;
  clip-path: inset(0% 0% 0% 0% round 20px);
}

.sheet-view {
  position: absolute;
  top: 0;
  width: 100%;
  /* Drop Sheet 자체의 상하 12px 여백 (헤더 유무와 무관하게 적용) */
  padding: 12px 0;
  opacity: 1;
}

/* ─── HEADER ─── */
.sheet-hd {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 48px;
  padding: 0 20px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  flex-shrink: 0;
}

.sheet-title {
  flex: 1;
  font-size: 18px;
  font-weight: 700;
  color: white;
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.back-btn {
  background: none;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  padding: 0;
  cursor: pointer;
  flex-shrink: 0;
  color: white;
}

.back-btn:active { opacity: 0.6; }

/* ─── LIST ─── */
/* 상하 12px 여백은 .sheet-view/.stack-top이 담당. 각 Item/Content wrapper(px-4/py-2) +
   BaseListItem(px-16/py-12)을 합치면 세로 14px(2+12)/가로 20px(4+16) */
.sheet-list {
  padding: 0;
}

.list-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 20px;
  cursor: pointer;
  border-radius: 10px;
  transition: background 0.12s;
}

.list-item:active { background: rgba(255,255,255,0.08); }

.item-label {
  flex: 1;
  font-size: 16px;
  color: #ffffff;
  line-height: 1.5;
}

.item-arrow {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  opacity: 0.8;
}

/* ─── STACK 인터랙션: 기존 카드가 축소+dim 되며 뒤로 밀리고, 새 카드가 위에 겹쳐서 나타남 ─── */
.stack-base {
  left: auto;
  bottom: auto;
  transform-origin: bottom right;
  transition:
    height 0.32s cubic-bezier(0.22, 1, 0.36, 1),
    clip-path 0.32s cubic-bezier(0.22, 1, 0.36, 1),
    opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1),
    transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
}

.stack-base.pushed {
  transform: scale(0.95);
}

.stack-base.pushed .sheet-view {
  pointer-events: none;
}

.stack-dim {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.3);
  opacity: 0;
  pointer-events: none;
  border-radius: inherit;
  transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1);
}

.stack-dim.show {
  opacity: 1;
}

.stack-top {
  position: absolute;
  left: auto;
  bottom: auto;
  width: 260px;
  height: auto;
  background: #27272E;
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  z-index: 310;
  /* Drop Sheet 자체의 상하 12px 여백 */
  padding: 12px 0;
  transition:
    opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1),
    transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
}

.stack-top.show {
  opacity: 1;
  pointer-events: auto;
}

/* ─── PLAYGROUND: 클릭한 지점을 트리거로 인식, Flip 로직을 실시간 계산 ─── */
.playground-hint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px;
  color: rgba(255,255,255,0.5);
  font-size: 15px;
  line-height: 1.5;
  pointer-events: none;
  z-index: 5;
  transition: opacity 0.2s ease;
}

.playground-hint.hide {
  opacity: 0;
}

.trigger-marker {
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #ff153c;
  box-shadow: 0 0 0 4px rgba(255,21,60,0.3);
  transform: translate(-50%, -50%);
  opacity: 0;
  pointer-events: none;
  z-index: 320;
  transition: opacity 0.2s ease;
}

.trigger-marker.show {
  opacity: 1;
}

</style>
</head>
<body>

<!-- ══════════════════════════════════════════ -->
<!-- 메뉴 리스트 + 플레이그라운드 (top 정렬 우선, Safe Area에 닿으면 카드 전체를 밀어올림) -->
<!-- ══════════════════════════════════════════ -->
<div class="player">

  <img class="player-bg-img" src="Img/player-bg.png" alt="">

  <div class="playground-hint">화면 아무 곳이나 클릭해보세요.<br>시트가 뜨면, 화살표 있는 메뉴를<br>눌러 depth2로 들어가보세요.</div>

  <div class="trigger-marker"></div>

  <div class="sheet stack-base">
    <div class="sheet-view">
      <div class="sheet-list">
        <div class="list-item js-open-submenu" data-val="menu1">
          <span class="item-label">메뉴</span>
          <svg class="item-arrow" viewBox="0 0 24 24" fill="none">
            <path d="M9 5l7 7-7 7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="list-item js-open-submenu" data-val="menu2">
          <span class="item-label">메뉴</span>
          <svg class="item-arrow" viewBox="0 0 24 24" fill="none">
            <path d="M9 5l7 7-7 7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="list-item" data-val="menu3">
          <span class="item-label">메뉴</span>
        </div>
        <div class="list-item" data-val="menu4">
          <span class="item-label">메뉴</span>
        </div>
      </div>
    </div>
    <div class="stack-dim"></div>
  </div>

  <div class="stack-top">
    <div class="sheet-hd">
      <button class="back-btn js-back" aria-label="뒤로가기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M15 5l-7 7 7 7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="sheet-title">메뉴</span>
    </div>
    <div class="sheet-list">
      <div class="list-item" data-val="sub1"><span class="item-label">메뉴</span></div>
      <div class="list-item" data-val="sub2"><span class="item-label">메뉴</span></div>
      <div class="list-item" data-val="sub3"><span class="item-label">메뉴</span></div>
      <div class="list-item" data-val="sub4"><span class="item-label">메뉴</span></div>
      <div class="list-item" data-val="sub5"><span class="item-label">메뉴</span></div>
      <div class="list-item" data-val="sub6"><span class="item-label">메뉴</span></div>
    </div>
  </div>

</div><!-- .player -->

<script>
(function () {
  'use strict';

  function initMenuStackPlayer(player) {
    const base       = player.querySelector('.stack-base');
    const baseView   = player.querySelector('.stack-base .sheet-view');
    const dim        = player.querySelector('.stack-dim');
    const top        = player.querySelector('.stack-top');
    const openSubBtns = player.querySelectorAll('.js-open-submenu');
    const backBtn    = player.querySelector('.js-back');
    const hint       = player.querySelector('.playground-hint');
    const marker     = player.querySelector('.trigger-marker');

    const FRAME_W = 390, FRAME_H = 844;
    const SHEET_W = 260, GAP = 8, MARGIN = 16;
    const PUSH_SCALE = 0.95; // .stack-base.pushed의 transform: scale(0.95)와 일치해야 함

    let isOpen  = false;
    let isSub   = false;
    let anchor  = null; // { h: 'right'|'left', v: 'down'|'up', left, top, height }

    function cornerKeys(h, v) {
      return { vertKey: v === 'down' ? 'top' : 'bottom', horizKey: h === 'right' ? 'left' : 'right' };
    }

    function closedClip(h, v) {
      const k = cornerKeys(h, v);
      const map = {
        'top-left':     'inset(0% 100% 100% 0% round 20px)',
        'top-right':    'inset(0% 0% 100% 100% round 20px)',
        'bottom-left':  'inset(100% 100% 0% 0% round 20px)',
        'bottom-right': 'inset(100% 0% 0% 100% round 20px)'
      };
      return map[k.vertKey + '-' + k.horizKey];
    }

    function place(x, y) {
      const height = baseView.scrollHeight;

      // 1순위: 가로 배치 — 트리거 좌/우 절반 기준으로 방향을 정하고, 그 방향에
      // 자리가 있는지 확인. 자리가 없으면 반대쪽을 시도.
      const preferRight = x < FRAME_W / 2;
      const fitsRight = (FRAME_W - x - GAP - MARGIN) >= SHEET_W;
      const fitsLeft  = (x - GAP - MARGIN) >= SHEET_W;

      let h = null;
      if (preferRight && fitsRight) h = 'right';
      else if (!preferRight && fitsLeft) h = 'left';
      else if (fitsRight) h = 'right';
      else if (fitsLeft) h = 'left';

      let v = y < FRAME_H / 2 ? 'down' : 'up';
      let left, topPx;

      if (h) {
        // 가로 배치 기본값: 세로는 갭 없이 트리거 y에 정확히 정렬(Top 또는 Bottom).
        // 단, 그 정렬 결과가 Safe Area(16px)를 침범하면 가로 배치 자체를 포기한다.
        const zeroGapTop = v === 'down' ? y : y - height;
        const fitsVertically = zeroGapTop >= MARGIN && (zeroGapTop + height) <= (FRAME_H - MARGIN);

        if (fitsVertically) {
          left = h === 'right' ? x + GAP : x - GAP - SHEET_W;
          left = Math.max(MARGIN, Math.min(left, FRAME_W - SHEET_W - MARGIN));
          topPx = zeroGapTop;
        } else {
          h = null; // 세로 정렬이 Safe Area를 침범 → 가로 배치 포기, 아래에서 세로 스택으로 전환
        }
      }

      if (!h) {
        // 2순위 fallback: 가로 배치가 불가능하거나(양쪽 다 공간 없음) 세로 정렬이
        // Safe Area를 침범할 때만 여기로 옴 — 트리거 위/아래 8px 간격의 세로 스택
        if (v === 'down') {
          topPx = Math.min(y + GAP, FRAME_H - MARGIN - height);
        } else {
          topPx = Math.max(y - GAP - height, MARGIN);
        }
        left = Math.max(MARGIN, Math.min(x - SHEET_W / 2, FRAME_W - SHEET_W - MARGIN));
        h = x < FRAME_W / 2 ? 'right' : 'left';
      }

      anchor = { h: h, v: v, left: left, top: topPx, height: height };

      marker.style.left = x + 'px';
      marker.style.top = y + 'px';
      marker.classList.add('show');
      hint.classList.add('hide');

      base.classList.add('no-transition');
      base.classList.remove('pushed');
      dim.classList.remove('show');
      top.classList.remove('show');
      base.style.left = left + 'px';
      base.style.top = topPx + 'px';
      base.style.bottom = 'auto';
      base.style.height = height + 'px';
      base.style.transformOrigin = cornerKeys(h, v).vertKey + ' ' + cornerKeys(h, v).horizKey;
      base.style.clipPath = closedClip(h, v);
      base.style.opacity = '0';
      void base.offsetWidth;
      base.classList.remove('no-transition');

      requestAnimationFrame(function () {
        base.style.clipPath = 'inset(0% 0% 0% 0% round 20px)';
        base.style.opacity = '1';
        base.style.pointerEvents = 'auto';
      });

      isOpen = true;
      isSub = false;
    }

    function close() {
      if (!anchor) return;
      base.style.clipPath = closedClip(anchor.h, anchor.v);
      base.style.opacity = '0';
      base.style.pointerEvents = 'none';
      base.classList.remove('pushed');
      dim.classList.remove('show');
      top.classList.remove('show');
      marker.classList.remove('show');
      isOpen = false;
      isSub = false;
    }

    function goToSubmenu(e) {
      e.stopPropagation();
      if (!isOpen || isSub) return;

      // 클릭된 아이템(트리거)이 속한 Item/Content의 top/bottom을 축소 전(현재) 위치로 측정
      const itemEl = e.currentTarget;
      const playerRect = player.getBoundingClientRect();
      const itemRect = itemEl.getBoundingClientRect();
      const itemTopBefore = itemRect.top - playerRect.top;

      // base 카드는 곧 scale(0.95)로 축소되므로, 그 축소가 끝난 뒤 이 아이템의 top이
      // 실제로 위치할 지점을 anchor 모서리 기준으로 미리 계산 (고정된 변은 그대로,
      // 반대쪽으로 갈수록 PUSH_SCALE 비율만큼 앵커 쪽으로 당겨짐)
      const vertKeyBase = cornerKeys(anchor.h, anchor.v).vertKey;
      function afterShrink(valueBefore) {
        if (vertKeyBase === 'top') {
          return anchor.top + PUSH_SCALE * (valueBefore - anchor.top);
        }
        const baseBottom = anchor.top + anchor.height;
        return baseBottom - PUSH_SCALE * (baseBottom - valueBefore);
      }
      const itemTop = afterShrink(itemTopBefore);

      // 기존 카드 축소 + dim
      base.classList.add('pushed');
      dim.classList.add('show');

      // 새 카드 높이를 재기 위해 우선 auto로 두고 측정
      top.classList.add('no-transition');
      top.style.height = 'auto';
      const topHeight = top.scrollHeight;

      // 위치: base와 같은 좌/폭. Item Top 정렬을 우선 시도하되, 하단 Safe Area(16px)를
      // 넘는 경우엔 정렬 기준을 포기하고 카드 전체를(높이 그대로, 잘리거나 스크롤 없이)
      // 위로 밀어올려서 하단이 Safe Area에 딱 맞게 노출시킴
      const spaceBelow = FRAME_H - MARGIN - itemTop;
      let topPos;
      if (topHeight <= spaceBelow) {
        topPos = itemTop;
      } else {
        topPos = Math.max(MARGIN, FRAME_H - MARGIN - topHeight);
      }

      top.style.left = anchor.left + 'px';
      top.style.top = topPos + 'px';
      top.style.bottom = 'auto';
      top.style.height = topHeight + 'px';
      top.style.transformOrigin = 'top ' + cornerKeys(anchor.h, anchor.v).horizKey;
      top.style.transform = 'scale(0.96)';
      void top.offsetWidth;
      top.classList.remove('no-transition');

      requestAnimationFrame(function () {
        top.classList.add('show');
        top.style.transform = 'scale(1)';
      });

      isSub = true;
    }

    function goBack() {
      base.classList.remove('pushed');
      dim.classList.remove('show');
      top.classList.remove('show');
      isSub = false;
    }

    openSubBtns.forEach(function (btn) { btn.addEventListener('click', goToSubmenu); });
    backBtn.addEventListener('click', function (e) { e.stopPropagation(); goBack(); });

    base.addEventListener('click', function (e) { e.stopPropagation(); });
    top.addEventListener('click', function (e) { e.stopPropagation(); });

    player.addEventListener('click', function (e) {
      // 열려있는 상태에서 배경을 누르면 우선 닫기만 하고, 다음 클릭에서 새 위치에 열림
      if (isOpen) {
        close();
        return;
      }
      const rect = player.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (FRAME_W / rect.width);
      const y = (e.clientY - rect.top) * (FRAME_H / rect.height);
      place(x, y);
    });
  }

  document.querySelectorAll('.player').forEach(initMenuStackPlayer);

})();
</script>
</body>
</html>
